services:
  - type: web
    name: contador-en-claro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1/chat/completions
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
